  const ACCENTS = {
    citrus: { main: "#F2A65A", soft: "rgba(242,166,90,0.16)" },
    berry: { main: "#E8607A", soft: "rgba(232,96,122,0.16)" },
    mint: { main: "#8FC1A9", soft: "rgba(143,193,169,0.16)" },
  };

  function rakutenUrl(keyword) {
    return "https://search.rakuten.co.jp/search/mall/" + encodeURIComponent(keyword) + "/";
  }

  // ムードボタンを描画
  const moodGrid = document.getElementById("mood-grid");
  MOODS.forEach((m) => {
    const btn = document.createElement("button");
    btn.className = "mood-btn";
    btn.innerHTML = '<span class="mood-emoji">' + m.emoji + "</span><span>" + m.label + "</span>";
    btn.onclick = () => drawFortune(m.id);
    moodGrid.appendChild(btn);
  });

  function drawFortune(moodId) {
    moodGrid.style.display = "none";
    document.getElementById("loading").style.display = "flex";
    const pool = RESULTS[moodId];
    const picked = pool[Math.floor(Math.random() * pool.length)];

    setTimeout(() => {
      document.getElementById("loading").style.display = "none";
      showResult(moodId, picked);
    }, 550);
  }

  let currentMoodLabel = "";
  let currentResult = null;

  function showResult(moodId, r) {
    currentMoodLabel = MOODS.find((m) => m.id === moodId).label;
    currentResult = r;
    const accent = ACCENTS[r.accent];
    const moodLabel = currentMoodLabel;

    document.getElementById("result-kicker").textContent = moodLabel + " のあなたへ";
    document.getElementById("result-kicker").style.color = accent.main;

    const card = document.getElementById("result-card");
    card.style.background = accent.soft;
    card.style.borderColor = accent.main;

    document.getElementById("tag-drink").style.background = accent.main;
    document.getElementById("tag-food").style.background = accent.main;

    document.getElementById("result-drink-name").textContent = r.drink;
    document.getElementById("result-drink-note").textContent = r.drinkNote;
    document.getElementById("result-food-name").textContent = r.food;
    document.getElementById("result-food-note").textContent = r.foodNote;
    document.getElementById("result-message").textContent = r.message;

    document.getElementById("product-name").textContent = r.product.name;
    document.getElementById("product-note").textContent = r.product.note;
    const link = document.getElementById("product-link");
    link.href = r.product.url || rakutenUrl(r.product.keyword);
    link.style.borderColor = accent.main;
    link.style.color = accent.main;

    document.getElementById("result-wrap").style.display = "block";
  }

  function shareOnX() {
    if (!currentResult) return;
    const text =
      "占ってみたら「" + currentMoodLabel + "」のあなたには\n" +
      "🥤 " + currentResult.drink + "\n" +
      "🍽 " + currentResult.food + "\n" +
      "がおすすめでした🔮\n#気分でドリンク占い";
    const shareUrl = window.location.href;
    const intentUrl =
      "https://twitter.com/intent/tweet?text=" +
      encodeURIComponent(text) +
      "&url=" +
      encodeURIComponent(shareUrl);
    window.open(intentUrl, "_blank", "noopener,noreferrer");
  }

  function reset() {
    document.getElementById("result-wrap").style.display = "none";
    moodGrid.style.display = "grid";
  }
